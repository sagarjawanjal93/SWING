name: Monthly Swing Screener Scan

on:
  schedule:
    # Run on the 28th of every month at 11 PM UTC
    - cron: '0 23 28 * *'
  # Allow manual trigger
  workflow_dispatch:

jobs:
  scan:
    runs-on: ubuntu-latest
    name: Nifty 500 Monthly Scan
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Set up Python 3.12
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install yfinance pandas "ta>=0.10.0" rich fastapi uvicorn httpx lxml html5lib beautifulsoup4 requests
      
      - name: Install swing package
        run: |
          pip install -e .
          python -c "import sys; print(sys.path)"
          pip list | grep -i swing
      
      - name: Run monthly screener
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          cd src/swing
          python -m swing.main_monthly -m nifty_500 --telegram




