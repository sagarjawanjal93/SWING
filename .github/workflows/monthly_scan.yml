name: Monthly Swing Screener Scan

on:
  schedule:
    # Run on the 28th of every month at 11 PM UTC
    - cron: '0 23 28 * *'
  # Allow manual trigger
  workflow_dispatch:

jobs:
  scan:
    runs-on: ubuntu-latest
    name: Nifty 500 Monthly Scan
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
      
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install build
          pip install -e .
      
      - name: Run monthly screener
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python -m swing.main_monthly -m nifty_500 --telegram
        working-directory: ${{ github.workspace }}/src/swing
